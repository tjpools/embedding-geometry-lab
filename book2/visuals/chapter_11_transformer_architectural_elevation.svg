<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Transformer Architectural Elevation</title>
  <desc id="description">A deterministic transformer block fixture starts from token and positional rows, projects Q K V, splits into two attention heads with distinct normalized rows, concatenates and projects, applies residual plus normalization, applies a positionwise feed-forward stage, then applies a second residual plus normalization. A control removes projected attention and changes final outputs.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 11 probe; August 14, 2026.</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#141719" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f7f3" />
  <text x="600.0" y="52" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0">TRANSFORMER ARCHITECTURAL ELEVATION</text>
  <text x="600.0" y="86" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">attention is one interface inside a larger constrained block</text>
  <rect x="45" y="122" width="145" height="78" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="117.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">INPUTS</text>
  <text x="117.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">token rows X</text>
  <rect x="210" y="122" width="145" height="78" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="282.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">POSITION</text>
  <text x="282.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">fixed rows P</text>
  <rect x="375" y="122" width="145" height="78" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <text x="447.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">H0 = X + P</text>
  <text x="447.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">model dim = 4</text>
  <rect x="540" y="122" width="145" height="78" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="612.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">Q K V PROJ</text>
  <text x="612.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">fixed Wq Wk Wv</text>
  <rect x="705" y="122" width="145" height="78" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="777.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">MHA</text>
  <text x="777.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">2 heads, dh = 2</text>
  <rect x="870" y="122" width="145" height="78" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="942.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">CONCAT + Wo</text>
  <text x="942.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">project to dmodel</text>
  <rect x="1035" y="122" width="145" height="78" rx="6" fill="#efefb7" stroke="#141719" stroke-width="3" />
  <text x="1107.5" y="154" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">+ RES + LN</text>
  <text x="1107.5" y="178" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">first interface</text>
  <line x1="194" y1="161.0" x2="206" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="359" y1="161.0" x2="371" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="524" y1="161.0" x2="536" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="689" y1="161.0" x2="701" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="854" y1="161.0" x2="866" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1019" y1="161.0" x2="1031" y2="161.0" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="70" y="250" width="515" height="205" rx="6" fill="#f7f7f3" stroke="#141719" stroke-width="3" />
  <text x="328" y="278" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">HEAD DISTINCTION (QUERY ROW 4)</text>
  <rect x="90" y="296" width="230" height="132" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <rect x="335" y="296" width="230" height="132" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <text x="205" y="324" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">HEAD 1 WEIGHTS</text>
  <text x="205" y="352" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">(0.231, 0.225,</text>
  <text x="205" y="374" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0"> 0.237, 0.307)</text>
  <text x="205" y="404" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">row sum = 1.000</text>
  <text x="450" y="324" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">HEAD 2 WEIGHTS</text>
  <text x="450" y="352" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">(0.317, 0.298,</text>
  <text x="450" y="374" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0"> 0.194, 0.192)</text>
  <text x="450" y="404" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">row sum = 1.000</text>
  <text x="328" y="438" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0">distinct heads, shared input rows</text>
  <line x1="775" y1="224" x2="602" y2="224" stroke="#141719" stroke-width="3" />
  <line x1="602" y1="224" x2="602" y2="286" stroke="#141719" stroke-width="3" />
  <line x1="602" y1="286" x2="575" y2="286" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="620" y="250" width="535" height="205" rx="6" fill="#f7f7f3" stroke="#141719" stroke-width="3" />
  <text x="888" y="278" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">ATTENTION OUTPUT AND FIRST RESIDUAL INTERFACE</text>
  <text x="888" y="325" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">projected attention z4 approx (0.163, -0.060, 0.458, -0.007)</text>
  <text x="888" y="357" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">r1 = h0 + z, then layer norm</text>
  <text x="888" y="389" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0">row means approx 0, row variances approx 1</text>
  <text x="888" y="421" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0">deterministic rerun: identical final rows</text>
  <rect x="380" y="478" width="180" height="78" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="470.0" y="510" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">POSITIONWISE FFN</text>
  <text x="470.0" y="534" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">ReLU(W1,b1) then W2,b2</text>
  <rect x="620" y="478" width="180" height="78" rx="6" fill="#efefb7" stroke="#141719" stroke-width="3" />
  <text x="710.0" y="510" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">+ RES + LN</text>
  <text x="710.0" y="534" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">second interface</text>
  <rect x="860" y="478" width="260" height="78" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <text x="990.0" y="510" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">FINAL ROW 4</text>
  <text x="990.0" y="534" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0">(0.255, -1.698, 0.654, 0.789)</text>
  <line x1="1120" y1="184" x2="602" y2="184" stroke="#141719" stroke-width="3" />
  <line x1="602" y1="184" x2="602" y2="474" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="560" y1="517" x2="616" y2="517" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="800" y1="517" x2="856" y2="517" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="45" y="582" width="1110" height="122" rx="6" fill="#efefb7" stroke="#141719" stroke-width="3" />
  <text x="100" y="611" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0">NO-ATTENTION CONTROL</text>
  <text x="600" y="633" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">set projected multi-head output z = 0 before first residual</text>
  <text x="600" y="655" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">delta final row4 approx (0.012, -0.026, 0.186, -0.172)</text>
  <text x="600" y="677" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">per-position ||delta||2: 0.905, 1.337, 0.465, 0.255</text>
  <text x="600" y="699" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">fixed deterministic fixture; not trained and not production-equivalent</text>
  <text x="600.0" y="728" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">attention alone is not the transformer: the block depends on interfaces between components</text>
</svg>
