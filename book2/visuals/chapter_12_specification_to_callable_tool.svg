  <text x="120" y="193" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">SPECIFICATION</text>
  <text x="120" y="226" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">book2.affine-row</text>
  <text x="120" y="249" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">version 1.0</text>
  <text x="120" y="272" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">dimensions 3 -&gt; 2</text>
  <rect x="225" y="160" width="170" height="142" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="310" y="193" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">FRAMEWORK</text>
  <text x="310" y="226" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">operation registry</text>
  <text x="310" y="249" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">affine_row</text>
  <text x="310" y="272" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">resolve by name</text>
  <rect x="415" y="160" width="170" height="142" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
