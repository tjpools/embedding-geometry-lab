  <text x="880" y="272" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">structured JSON</text>
  <rect x="985" y="160" width="170" height="142" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="1070" y="193" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">CALLABLE</text>
  <text x="1070" y="226" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">request vector.v1</text>
  <text x="1070" y="249" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">internal affine row</text>
