<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">From Specification to Callable Tool</title>
  <desc id="description">A deterministic contract chain connects an architecture specification, framework operation registry, serialized model package, validating loader, selected runtime capabilities, and callable request and response. A corrupted declared dimension follows a dashed path to rejection before construction or invocation.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 12 probe; August 14, 2026.</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#141719" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f7f3" />
  <text x="600.0" y="54" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0">From Specification to Callable Tool</text>
  <text x="600.0" y="88" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">callability appears only when each boundary preserves its declared contract</text>
  <path d="M 209 231 L 218 231" fill="none" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
