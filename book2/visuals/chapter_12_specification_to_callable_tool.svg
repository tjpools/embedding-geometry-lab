  <rect x="305" y="402" width="220" height="48" rx="6" fill="#efefb7" stroke="#141719" stroke-width="3" />
  <text x="415" y="433" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">PACKAGE_VALID</text>
  <text x="205" y="480" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0">construction count = 2</text>
  <text x="415" y="480" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">reload + reinvoke identical</text>
  <rect x="634" y="355" width="490" height="165" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <text x="658" y="388" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0">CALLABLE EXCHANGE</text>
  <rect x="658" y="410" width="180" height="66" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="748" y="435" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">REQUEST</text>
  <text x="748" y="460" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0">[2, -1, 0.5]</text>
  <path d="M 845 443 L 907 443" fill="none" stroke="#141719" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="916" y="410" width="180" height="66" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="1006" y="435" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">RESPONSE</text>
