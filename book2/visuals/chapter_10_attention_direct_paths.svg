<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Attention Opens Direct Paths</title>
  <desc id="description">A recurrent lane carries position one through five state updates. An attention lane connects five value vectors directly to output five through normalized weights. Changing value one leaves the weights fixed but changes the output. A causal-mask inset marks future positions as excluded by rule.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 10 probe; August 14, 2026.</metadata>
