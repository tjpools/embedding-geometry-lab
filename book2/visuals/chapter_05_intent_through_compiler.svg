<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Intent Through the Compiler</title>
  <desc id="description">An accepted Rust TokenRecord crosses source declaration, type checking, declared layout, MIR translation, and executable output. A temporary active integer value branches downward at type checking and is rejected before later artifacts exist.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 5 probe; August 13, 2026.</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#141719" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f7f3" />
  <text x="600.0" y="58" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" text-anchor="middle" letter-spacing="0">INTENT THROUGH THE COMPILER</text>
  <text x="600.0" y="94" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">distinct interfaces constrain, lay out, translate, and execute</text>
  <rect x="30.0" y="205" width="190" height="180" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="125" y="236" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">SOURCE</text>
  <text x="125" y="266" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">TokenRecord</text>
  <text x="125" y="290" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">u32 | f32 | bool</text>
  <text x="125" y="314" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">active: true</text>
  <rect x="270.0" y="205" width="190" height="180" rx="6" fill="#efefb7" stroke="#141719" stroke-width="3" />
  <text x="365" y="236" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">TYPE CHECK</text>
  <text x="365" y="266" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">field types agree</text>
  <text x="365" y="290" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">accepted source</text>
  <text x="365" y="314" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">3 tests pass</text>
  <rect x="510.0" y="205" width="190" height="180" rx="6" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="605" y="236" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">LAYOUT</text>
  <text x="605" y="266" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">size 12 | align 4</text>
  <text x="605" y="290" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">offsets 0 | 4 | 8</text>
  <text x="605" y="314" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">trailing padding</text>
  <rect x="750.0" y="205" width="190" height="180" rx="6" fill="#b9ddea" stroke="#141719" stroke-width="3" />
  <text x="845" y="236" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">MIR</text>
  <text x="845" y="266" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">typed function</text>
  <text x="845" y="290" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">typed record</text>
  <text x="845" y="314" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">intermediate form</text>
  <rect x="990.0" y="205" width="190" height="180" rx="6" fill="#efd5d5" stroke="#141719" stroke-width="3" />
  <text x="1085" y="236" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">OUTPUT</text>
  <text x="1085" y="266" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">size=12</text>
  <text x="1085" y="290" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">offsets=0,4,8</text>
  <text x="1085" y="314" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">result=1.5</text>
  <line x1="228.0" y1="295" x2="258.0" y2="295" stroke="#141719" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="468.0" y1="295" x2="498.0" y2="295" stroke="#141719" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="708.0" y1="295" x2="738.0" y2="295" stroke="#141719" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="948.0" y1="295" x2="978.0" y2="295" stroke="#141719" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="365" y1="393" x2="365" y2="514" stroke="#141719" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8" />
  <rect x="245.0" y="525" width="240" height="112" rx="6" fill="#f7f7f3" stroke="#141719" stroke-width="3" />
  <text x="365" y="556" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">REJECTED</text>
  <text x="365" y="586" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">active: 1</text>
  <text x="365" y="610" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">mismatched types</text>
  <text x="365" y="675" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">no layout, MIR, or executable</text>
  <rect x="190" y="700" width="820" height="42" rx="6" fill="#efefb7" stroke="#141719" stroke-width="2" />
  <text x="600" y="727" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">TYPE ACCEPTANCE IS NOT PROOF OF PURPOSE OR TASK CORRECTNESS</text>
</svg>
