<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">A Token Through the Machine</title>
  <desc id="description">A deterministic execution trace carries the text small models run through token IDs, embedding plus position rows, one attention-residual-normalization-feed-forward-residual-normalization block, a final hidden row, vocabulary logits, lowest-ID-tie argmax, and decoding to models. A subordinate width-corruption lane stops at block input validation; later stages are unexecuted.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 15 probe; August 14, 2026.</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#141719" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f7f3" />
