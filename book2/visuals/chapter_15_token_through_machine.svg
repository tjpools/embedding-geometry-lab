  <text x="600.0" y="76" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">validated values move in runtime order; each handoff records shape, digest, allocation, and work</text>
