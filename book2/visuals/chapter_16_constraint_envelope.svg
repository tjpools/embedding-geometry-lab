  <text x="48" y="481" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0">quartzbird -&gt; &lt;unk&gt; ID 0</text>
  <text x="48" y="504" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">velvetaxiom -&gt; &lt;unk&gt; ID 0</text>
  <text x="48" y="527" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">same embedding (0.0, 0.0, 0.0, 0.0)</text>
  <rect x="425" y="425" width="350" height="150" rx="5" fill="#efdcae" stroke="#141719" stroke-width="3" />
