  <text x="600.0" y="720" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">THE ENVELOPE BOUNDS OBSERVED OPERATION, NOT ONTOLOGY</text>
