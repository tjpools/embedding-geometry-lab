  <text x="443" y="504" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">allowed-ID argmax -&gt; ID 0</text>
  <text x="443" y="527" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">logit bytes equal before / after</text>
  <rect x="820" y="425" width="350" height="150" rx="5" fill="#efdcae" stroke="#141719" stroke-width="3" />
  <text x="838" y="451" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">ARCHITECTURE</text>
  <text x="1152" y="451" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" text-anchor="end" letter-spacing="0">numerical difference</text>
  <text x="838" y="481" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0">attention contribution -&gt; zero</text>
  <text x="838" y="504" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">max |output difference| 0.138179224</text>
  <text x="838" y="527" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">request + other parameters fixed</text>
  <rect x="30" y="600" width="1140" height="86" rx="5" fill="#f7f7f3" stroke="#141719" stroke-width="3" stroke-dasharray="9 7" />
  <text x="52" y="628" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">CLAIM-SCOPE BOUNDARY</text>
  <text x="600" y="628" fill="#141719" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0">understands | is_person | cannot_ever_understand</text>
