<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">A Map and Its Local Change</title>
  <desc id="description">The left side shows a square coordinate grid transformed globally by matrix A. The right side compares the nonlinear map near p with the local directional change predicted by the Jacobian at p; the two short arrows nearly coincide.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 4 probe; August 13, 2026.</metadata>
