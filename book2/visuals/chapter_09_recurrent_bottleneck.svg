<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">The Recurrent Bottleneck</title>
  <desc id="description">Five ordered inputs update hidden states h one through h five. Each state requires its predecessor, and final-state sensitivity to the first input crosses all five updates. A zero-recurrence control breaks cross-position sensitivity. Counts describe dependencies, not measured runtime.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the verified Chapter 9 probe; August 14, 2026.</metadata>
