<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Three Forms of Constraint</title>
  <desc id="description">Three aligned panels compare the represented transition locked-closed to unlocked-closed to unlocked-open. The algebraic panel gates partial operations by their domains. The symbolic panel gates actions by represented preconditions. The programmed panel gates typed states by Rust match branches and returns Result values. A failed attempt to open locked-closed is undefined, inapplicable, or Err Locked respectively. This is a comparison of interfaces, not an equivalence.</desc>
  <metadata>Original visual by Terrence J McLaughlin; generated from the execution-verified chapter_01_door_model.rs; August 12, 2026.</metadata>
